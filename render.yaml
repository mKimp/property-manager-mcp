services:
  - type: web
    name: property-manager-api
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build --workspace=apps/server
    startCommand: npx prisma migrate deploy && npm run start --workspace=apps/server
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TURSO_DATABASE_URL
        sync: false   # you enter this manually in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false   # set to your Vercel URL after frontend deploys
